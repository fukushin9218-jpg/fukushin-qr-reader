<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福岡進学塾 QR受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

 <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f4fbff 0%, #ffffff 50%, #fffdf2 100%);
    color: #1f2937;
  }

  h1 {
    font-size: 42px;
    margin: 10px 0 5px;
    font-weight: 700;
  }

  h2 {
    font-size: 30px;
    margin: 0 0 20px;
    color: #3b82f6;
  }

  #reader {
    width: 100%;
    max-width: 620px;
    margin: 15px auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
  }

  button {
    font-size: 24px;
    font-weight: bold;
    padding: 16px 40px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin: 10px 0;
  }

  #message {
    width: 90%;
    max-width: 650px;
    margin: 20px auto 0;
    padding: 18px 10px;
    font-size: 28px;
    font-weight: bold;
    background: white;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    min-height: 38px;
  }

  @media (orientation: landscape) {
    body {
      padding-top: 10px;
    }

    h1 {
      font-size: 38px;
      margin: 5px 0;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    .character {
  width: 280px;
}

    #reader {
      max-width: 520px;
      margin: 10px auto;
    }

    #message {
      margin-top: 12px;
      font-size: 26px;
    }
  }

   .character {
  position: fixed;
  bottom: 20px;
  width: 320px;
  max-height: 65vh;
  object-fit: contain;
  z-index: 2;
}

.cat-teacher {
  left: 25px;
}

.owl-teacher {
  right: 25px;
}

@media (max-width: 1100px) {
  .character {
    width: 240px;
  }
} 
 .school-title {
  font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 48px;
  font-weight: 900;
  color: #0757b7;
  letter-spacing: 2px;
  margin: 4px 0 0;
  text-shadow: 0 3px 4px rgba(0, 70, 150, 0.18);
}

.reception-title {
  font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 64px;
  font-weight: 900;
  color: #0757b7;
  letter-spacing: 4px;
  margin: 0 0 12px;
  text-shadow: 0 4px 5px rgba(0, 70, 150, 0.20);
}

   .cat-speech {
  position: fixed;
  left: 35px;
  bottom: 520px;
  width: 250px;
  padding: 18px 15px;
  background: white;
  border: 5px solid #ffd84d;
  border-radius: 50%;
  color: #0757b7;
  font-size: 25px;
  font-weight: 900;
  line-height: 1.4;
  text-align: center;
  z-index: 3;
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.10);
}
   .owl-speech {
  position: fixed;
  right: 35px;
  bottom: 520px;
  width: 250px;
  padding: 18px 15px;
  background: white;
  border: 5px solid #ff9fbd;
  border-radius: 50%;
  color: #0757b7;
  font-size: 28px;
  font-weight: 900;
  line-height: 1.4;
  text-align: center;
  z-index: 3;
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.10);
}
 </style>
</head>

<body>

  <img src="動画②.png" class="character cat-teacher" alt="猫先生">
  <div class="cat-speech">QRコードを<br>カメラにかざしてね！</div>
  <img src="動画③.png" class="character owl-teacher" alt="フクロウ先生">
  <div class="owl-speech">日々努力！</div>
  <h1 class="school-title">福岡進学塾</h1>
<h2 class="reception-title">入退室受付</h2>

  <button onclick="startCamera()">カメラを起動</button>

  <div id="reader"></div>

  <div id="message">
    カメラを起動してください
  </div>

  <script>
    let scanner = null;
let isProcessing = false;
    async function startCamera() {
      if (!audioCtx) {
  audioCtx = new AudioContextClass();
}
if (audioCtx.state === "suspended") {
  await audioCtx.resume();
}
      const message = document.getElementById("message");

      try {
        scanner = new Html5Qrcode("reader");

        message.textContent = "カメラを起動しています…";

        await scanner.start(
          { facingMode: "user" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          function(decodedText) {
if (isProcessing) return;
isProcessing = true;
            message.textContent = "受付しています…";

  const gasUrl =
    "https://script.google.com/macros/s/AKfycbzs4I41S1LJ0gAocOUOE_PxE3yxMwrIIebBp34DT83bXARjN5iqtKPlxUzhWrB5L1aP/exec";

  fetch(
  gasUrl + "?api=attendance&studentId=" + encodeURIComponent(decodedText)
).then(response => response.json())
.then(result => {
  if (result.success) {
    playSuccessSound();
    message.textContent =
      result.name + "さん " + result.attendanceType + "しました";
  } else {
    message.textContent = result.message;
  }

  setTimeout(function() {
    message.textContent = "QRコードをカメラにかざしてください";
    isProcessing = false;
  }, 3000);
})
.catch(error => {
  console.error(error);
  message.textContent = "通信に失敗しました。もう一度QRコードをかざしてください";

  setTimeout(function() {
    message.textContent = "QRコードをカメラにかざしてください";
    isProcessing = false;
  }, 3000);
});
    },
    function() {}
  );
            message.textContent = "QRコードをカメラにかざしてください";

  } catch (error) {
    message.textContent = "カメラエラー：" + error;
  }
}
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
    function playSuccessSound() {
  try {
   if (!audioCtx) {
  audioCtx = new AudioContextClass();
}

if (audioCtx.state === "suspended") {
  audioCtx.resume();
}

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
    oscillator.type = "sine";

    gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + 0.25
    );

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.25);
  } catch (e) {
    console.log("音声を再生できませんでした");
  }
}
  </script>

</body>
</html>
