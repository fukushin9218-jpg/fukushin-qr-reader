 <style>

.school-title {

.cat-speech,
.owl-speech {
  bottom: 430px;
}

 .school-title {

   .cat-speech {

   .owl-speech {

  position: fixed;

width: 260px;

 </style>
</head>

<body>

  <img src="動画②.png" class="character cat-teacher" alt="猫先生">
  <img src="動画③.png" class="character owl-teacher" alt="フクロウ先生">
  <div id="result-sign"></div>
  <div id="result-reason"></div>
  <h1 class="school-title">福岡進学塾</h1>
<h2 class="reception-title">入退室受付</h2>

  <button onclick="startCamera()">カメラを起動</button>

  <div id="reader"></div>

  <div id="message">
    カメラを起動してください
  </div>

  <script>
    let scanner = null;
let isProcessing = false;
    async function startCamera() {
      if (!audioCtx) {
  audioCtx = new AudioContextClass();
}
if (audioCtx.state === "suspended") {
  await audioCtx.resume();
}
      const message = document.getElementById("message");

      try {
        scanner = new Html5Qrcode("reader");

        message.textContent = "カメラを起動しています…";

        await scanner.start(
          { facingMode: "user" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          function(decodedText) {
if (isProcessing) return;
isProcessing = true;
            message.textContent = "受付しています…";

  const gasUrl =
    "https://script.google.com/macros/s/AKfycbzs4I41S1LJ0gAocOUOE_PxE3yxMwrIIebBp34DT83bXARjN5iqtKPlxUzhWrB5L1aP/exec";

  fetch(
  gasUrl + "?api=attendance&studentId=" + encodeURIComponent(decodedText)
).then(response => response.json())
.then(result => {
  if (result.success) {
    const resultSign = document.getElementById("result-sign");
    resultSign.style.borderColor = "#22a447";
resultSign.style.color = "#0757b7";
    resultSign.style.fontSize = "50px";
resultSign.textContent = result.attendanceType;
resultSign.style.visibility = "visible";
    document.getElementById("result-reason").style.visibility = "hidden";
    playSuccessSound();
    message.textContent =
      result.name + "さん " + result.attendanceType + "しました";
  } else {
    const resultSign = document.getElementById("result-sign");
 resultSign.textContent = "×";
resultSign.style.borderColor = "transparent";
resultSign.style.color = "#e53935";
resultSign.style.fontSize = "110px";
resultSign.style.visibility = "visible";
    message.textContent = "";
    const resultReason = document.getElementById("result-reason");
resultReason.textContent =
  result.message.includes("5分以内")
    ? "5分以内のため\n受付しません"
    : result.message;
resultReason.style.visibility = "visible";
  }

  setTimeout(function() {
    document.getElementById("result-sign").style.visibility = "hidden";
    document.getElementById("result-reason").style.visibility = "hidden";
    message.textContent = "QRコードをカメラにかざしてください";
    isProcessing = false;
  }, 3000);
})
.catch(error => {
  console.error(error);
  message.textContent = "通信に失敗しました。もう一度QRコードをかざしてください";

  setTimeout(function() {
    message.textContent = "QRコードをカメラにかざしてください";
    isProcessing = false;
  }, 3000);
});
    },
    function() {}
  );
            message.textContent = "QRコードをカメラにかざしてください";

  } catch (error) {
    message.textContent = "カメラエラー：" + error;
  }
}
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSuccessSound() {
  try {
    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const now = audioCtx.currentTime;
    const notes = [880, 1175, 1568];

    notes.forEach((frequency, index) => {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const startTime = now + index * 0.12;

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, startTime);

      gainNode.gain.setValueAtTime(0.001, startTime);
      gainNode.gain.exponentialRampToValueAtTime(0.28, startTime + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.18);

      oscillator.start(startTime);
      oscillator.stop(startTime + 0.2);
    });

  } catch (e) {
    console.log("音声を再生できませんでした");
  }
}
  </script>

</body>
</html>
